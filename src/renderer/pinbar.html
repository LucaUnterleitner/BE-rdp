<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Session bar</title>
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body style="margin:0;overflow:hidden">
  <div class="pinbar" id="pinbar" role="toolbar" aria-label="Full-screen session">
    <span class="pinbar__name" id="pinbar-name"></span>
    <button type="button" data-act="leave" title="Ctrl+Alt+Break">Leave full screen</button>
    <button type="button" data-act="dock" id="pinbar-dock" hidden>Back to app</button>
    <button type="button" data-act="disconnect">Disconnect</button>
  </div>
  <script type="module" src="js/pinbar.js"></script>
</body>
</html>
